name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Both jobs always run: the whole reason this matrix exists is to learn about the
      # backend the author's machine cannot execute, so a macOS failure must not cancel
      # the Linux job that would have reported the epoll problem.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Show toolchain
        run: |
          cmake --version
          ${CXX:-c++} --version
          python3 --version

      # scripts/verify.sh is exactly what a developer runs locally: a clean configure
      # with -Wall -Wextra -Werror, a full build, and the whole ctest suite including
      # the Python integration test. Running the same script here is what makes
      # "verify.sh passed" and "CI is green" mean the same thing.
      - name: Clean configure, build, and test
        run: ./scripts/verify.sh
